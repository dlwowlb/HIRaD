dataset:
  # Directories of .npz samples. If the three paths are identical the files
  # are split with train_val_test_split and split_seed instead.
  train_dir: ./data/train
  val_dir:   ./data/val
  test_dir:  ./data/test
  train_val_test_split: [0.80, 0.10, 0.10]
  split_seed: 42
  max_seq_len: 100
  max_motion_frames: 300
  points_per_frame: 128

latent_graph:
  use_motion_encoder: true   # paired body motion available for L_ctr
  num_nodes: 10
  node_dim: 256
  point_feat_dim: 256
  point_in_dim: 4            # [lateral, height, depth, doppler]
  num_points: 128
  out_dim: 512
  ctx_dim: 128
  ctx_history_len: 5         # temporal context window K
  num_heads: 4
  num_semantic_queries: 4
  encoder_hidden: [64, 128]
  init_rounds: 3
  compete_alpha: 0.2
  motion_hidden: 256

  beta_kl: 0.1
  lambda_contrastive: 1.0
  lambda_semantic: 0.5
  lambda_conf: 0.0
  contrastive_dim: 256
  contrastive_temp: 0.07

  world:
    shared_dim: 512
    embed_dim: 256           # semantic bottleneck dimension

  lr: 1e-4
  weight_decay: 0.01
  grad_clip: 1.0
  warmup_epochs: 5

captioner:
  device: "cuda:0"
  qwen_path: "Qwen/Qwen3-8B"   # Hugging Face id or a local directory
  use_qlora: true
  lora_r: 4
  lora_alpha: 32
  lora_dropout: 0.05
  lambda_caption: 1.0
  prompt: "Describe the motion:"
  node_drop_rate: 0.1
  generation:
    max_new_tokens: 48
    do_sample: true
    temperature: 0.7
    top_p: 0.9
    repetition_penalty: 1.3
    no_repeat_ngram_size: 4

# Input of the semantic pathway. "full" uses the residual trajectories.
# "no_residue_strict" (prior only) and "post_mu_input" (posterior only) are
# the controls reported in the paper.
ablation:
  mode: full

# Applied to the training split only.
augment:
  enabled: true
  p_doppler_scale: 0.8
  doppler_scale_range: [0.3, 1.0]
  p_doppler_jitter: 0.5
  doppler_sigma: 0.05
  p_ghost: 0.5
  ghost_rate: 0.10
  ghost_depth_shift: [1.0, 2.5]
  ghost_doppler_atten: [0.3, 0.7]
  p_upper_body_bias: 0.2
  upper_body_drop: 0.3
  lower_threshold: 0.3
  p_spatial_jitter: 0.7
  spatial_sigma: 0.03
  p_dropout: 0.5
  dropout_rate: 0.15
  p_frame_dropout: 0.1
  frame_dropout_rate: 0.05
  p_depth_shift: 0.2
  depth_shift_sigma: 0.1
  p_azimuth_rot: 0.2
  azimuth_rot_deg: 20.0
  always_shuffle: true

training:
  stage1:
    epochs: 200
    batch_size: 170
    lr: 1e-4
    warmup_epochs: 5
    device: "cuda:0"
  stage2:
    epochs: 100
    batch_size: 72
    lr: 1e-5
    weight_decay: 0.05
    caption_every: 5
    patience: 100
    device: "cuda:0"
  stage3:
    epochs: 10
    batch_size: 40
    lg_lr: 1e-5
    proj_lr: 5e-5
    qwen_lr: 3e-5
    weight_decay: 0.01
    caption_every: 3
    device: "cuda:0"

logging:
  save_every: 10
  save_dir: ./checkpoints/hirad
  test_dir: ./test/hirad
